name: QuantShield DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - work
  pull_request:
    branches:
      - main
      - work

env:
  IMAGE_NAME: quantshield-backend

jobs:
  # =========================================================================
  # STAGE 1: Unit & Integration Testing
  # =========================================================================
  test:
    name: Run Unit & API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute API & Metrics Validation
        run: |
          python -m uvicorn backend.src.api.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          echo "Waiting for QuantShield API to boot..."
          SUCCESS=0
          for i in {1..30}; do
            STATUS=$(curl -s http://127.0.0.1:8000/api/v1/risk/health || true)
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "QuantShield Health Check: PASSED"
              echo "Response: $STATUS"
              SUCCESS=1
              break
            fi
            sleep 1
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Health check failed to respond within 30 seconds."
            kill $SERVER_PID || true
            exit 1
          fi

          echo "Verifying Prometheus Metrics Endpoint..."
          curl -s http://127.0.0.1:8000/metrics | grep -E "http_requests_total|process_cpu_seconds_total" || true
          echo "Validation succeeded!"
          kill $SERVER_PID || true

  # =========================================================================
  # STAGE 2: Ansible IaC & Configuration Validation
  # =========================================================================
  ansible-lint:
    name: Validate Ansible Configuration
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible Core
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Verify Ansible Playbook Syntax & Dry-Run
        run: |
          ansible-playbook -i ansible/inventory ansible/playbook.yml --syntax-check

  # =========================================================================
  # STAGE 3: Docker Build & Verification
  # =========================================================================
  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Docker Container Image
        run: |
          docker build -t quantshield-backend:latest -t quantshield-backend:${{ github.sha }} .
          docker images | grep quantshield-backend

  # =========================================================================
  # STAGE 4: Kubernetes Manifest Validation & Orchestration Simulation
  # =========================================================================
  k8s-validation:
    name: Validate Kubernetes Manifests & Rollout
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install KinD & Create Kubernetes Cluster
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name quantshield-cluster
          kubectl cluster-info

      - name: Build & Load Image into KinD Cluster
        run: |
          docker build -t quantshield-backend:v1.0.0 .
          kind load docker-image quantshield-backend:v1.0.0 --name quantshield-cluster

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for Deployment Rollout
        run: |
          kubectl rollout status deployment/quantshield-backend --timeout=120s
          kubectl get pods -o wide
          kubectl get svc

      - name: Test Rolling Update (v1.0.0 -> v2.0.0 simulation)
        run: |
          docker tag quantshield-backend:v1.0.0 quantshield-backend:v2.0.0
          kind load docker-image quantshield-backend:v2.0.0 --name quantshield-cluster
          kubectl set image deployment/quantshield-backend quantshield-api=quantshield-backend:v2.0.0
          kubectl rollout status deployment/quantshield-backend --timeout=120s
          kubectl rollout history deployment/quantshield-backend

      - name: Test Rollback (v2.0.0 -> v1.0.0)
        run: |
          kubectl rollout undo deployment/quantshield-backend
          kubectl rollout status deployment/quantshield-backend --timeout=120s
          kubectl rollout history deployment/quantshield-backend
